[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "india-day-trader"
version = "0.3.0"
description = "Eleven skills for Indian cash-equity research and local paper trading"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/kirasvg/india-day-trader"
Documentation = "https://kirasvg.github.io/india-day-trader/"
Issues = "https://github.com/kirasvg/india-day-trader/issues"
Changelog = "https://github.com/kirasvg/india-day-trader/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["india_trader"]
include-package-data = false

[tool.setuptools.package-data]
india_trader = ["templates/*.json", "templates/demo/*", "web/*.html", "web/*.css", "web/*.js"]

[project.scripts]
india-trader = "india_trader.cli:main"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"skills/*/runner.py" = ["E402"]

[tool.ty.environment]
python-version = "3.9"
